# openspec/config.yaml — 100_médica Valentina (Gentle AI SDD)
schema: spec-driven

context: |
  Project: %100 médica — mobile-first interactive SPA for a medical school graduation celebration.
  Repo: github.com/marcostoledo96/100_medica_valentina (worktree branch: feat/issue-10-vitales).
  Stack: React 18 + TypeScript (strict: true) + Vite 6 + Tailwind CSS 3 + Zod 4 + Framer Motion.
  Testing: Vitest 3 + Testing Library (unit) and Playwright (E2E). Setup file: src/test/setup.ts.
  Architecture: 100% frontend SPA, zero backend. Content fully decoupled — data lives in
  src/content/*.ts validated by Zod schemas in src/domain/schemas/*.ts; components never
  hardcode names, dates, URLs, or narrative copy.
  Conventions: mobile-first viewport 360px–430px, 44x44px touch targets, native scroll,
  anti-AI-slop design rules (AGENTS.md), Conventional Commits, zero AI attribution.
  Session preflight: execution_mode=auto, delivery_strategy=ask-on-risk,
  review_budget_changed_lines=400, artifact_store=openspec.

rules:
  proposal:
    - Every feature must map to a documented issue (docs/07_ISSUES_Y_CRITERIOS.md) and its acceptance criteria
    - State scope boundaries explicitly; include non-goals
    - Include a rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Content requirements MUST specify the decoupled data module (src/content/*.ts) and Zod schema (src/domain/schemas/*.ts)
  design:
    - Document architecture decisions with rationale (ADR-style)
    - Component design must respect the container/presentational split (features/ vs components/ui/)
    - Include mobile viewport and accessibility (ARIA, keyboard focus) considerations
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Every task MUST reference the test file(s) that prove it
  apply:
    guidelines:
      - Follow existing code patterns and the gentle-sdd-react skill lifecycle (schema -> content -> primitives -> container -> tests)
      - Run typecheck and lint before marking tasks complete
      - Protected paths (Issue #10 Phase A — do NOT modify): src/App.tsx, src/App.test.tsx, src/content/sections.ts, src/content/sections.test.ts, src/components/layout/**, src/hooks/useActiveSection*, src/features/expediente/**, src/features/gallery/**
    tdd: true
    test_command: 'npm test'
  verify:
    test_command: 'npm test'
    build_command: 'npm run build'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
